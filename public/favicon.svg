<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Michroma&amp;display=swap');
      .font {
        font-family: 'Michroma', sans-serif;
        font-size: 46px;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="24" fill="#050505" />
  <text x="50" y="52" class="font">
    <tspan fill="#ffffff">Q</tspan><tspan fill="url(#gradient)">X</tspan>
  </text>
</svg>
